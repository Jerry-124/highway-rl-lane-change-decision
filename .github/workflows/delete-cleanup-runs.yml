name: delete-cleanup-runs

on:
  push:
    paths:
      - '.github/workflows/delete-cleanup-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded cleanup run records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run_id in 33304434629 33304502711; do
            gh api --method DELETE "repos/${REPO}/actions/runs/${run_id}" || true
          done
