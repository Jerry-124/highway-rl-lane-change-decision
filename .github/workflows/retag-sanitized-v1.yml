name: retag-sanitized-v1

on:
  push:
    paths:
      - '.github/workflows/retag-sanitized-v1.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move v1.0.0 to sanitized history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Jerry-124"
          git config user.email "216129675+Jerry-124@users.noreply.github.com"
          git tag -fa v1.0.0 4fc4bff6a960ed1d308af5c7728195f8d66166e6 -m "Highway RL lane-change baseline v1.0.0"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin refs/tags/v1.0.0 --force
